<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#176b50">
<title>工地记工小助手</title>
<style>
:root{--green:#176b50;--bg:#f3f6f4;--card:#fff;--ink:#17231e;--muted:#68756e;--line:#e0e8e3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans SC",sans-serif;color:var(--ink);padding-bottom:84px}
header{background:var(--green);color:white;padding:20px 16px 18px;border-radius:0 0 22px 22px}
h1{font-size:22px;margin:0 0 6px}header p{margin:0;color:#d8eee4;font-size:13px}
main{max-width:700px;margin:auto;padding:14px}
.panel{background:var(--card);border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px #163b2910}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1;min-width:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.stat{background:#ffffff1a;padding:12px;border-radius:12px}.stat small{display:block;color:#d8eee4}.stat strong{font-size:22px;display:block;margin-top:3px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:white;font:inherit;color:var(--ink)}button{border:0;border-radius:11px;padding:12px 14px;font:inherit;font-weight:650;background:var(--green);color:white;cursor:pointer}.secondary{background:#e7f2ec;color:var(--green)}.danger{background:#fff0ed;color:#a23424}.full{width:100%;margin-top:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:8px max(8px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));z-index:5}.nav button{flex:1;max-width:180px;background:transparent;color:var(--muted);padding:10px 3px;font-size:12px}.nav button.active{background:#e7f2ec;color:var(--green)}.hidden{display:none!important}.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.itemtop{display:flex;justify-content:space-between;gap:10px}.muted{color:var(--muted);font-size:13px}.money{font-weight:750;color:var(--green)}.empty{text-align:center;color:var(--muted);padding:20px 4px}.smallbtn{padding:7px 10px;font-size:12px}.tag{display:inline-block;background:#e7f2ec;color:var(--green);border-radius:8px;padding:3px 7px;font-size:12px}
</style>
</head>
<body>
<header><h1>🦺 工地记工小助手</h1><p id="projectSubtitle">个人使用 · 数据保存在本机浏览器</p>
<div class="stats"><div class="stat"><small>当前项目累计人工费</small><strong id="totalCost">¥0</strong></div><div class="stat"><small>累计记工人次</small><strong id="totalEntries">0</strong></div></div></header>
<main>
<section id="home">
<div class="panel"><div class="row"><div><label>当前项目</label><select id="activeProject"></select></div><button id="addProjectBtn" class="secondary" style="flex:0 0 auto;margin-top:26px">＋ 新项目</button></div>
<div class="muted" style="margin-top:8px">工人数量不限。换项目只需新增名称；工人名单可继续使用。记完一笔会保留当前工人，方便连续录入。</div></div>
<div class="panel"><h3 style="margin:0">快速记工</h3>
<label>日期</label><input type="date" id="workDate">
<label>工人</label><select id="workerSelect"></select>
<div class="row"><div><label>工资方式</label><select id="wageType"><option value="daily">日工资记工</option><option value="monthly">月工资登记</option></select></div><div><label>工数</label><select id="days"><option value="1">1 工</option><option value="0.5">半工</option><option value="1.5">1.5 工</option><option value="2">2 工</option><option value="0.25">1/4 工</option></select></div><div><label id="rateLabel">日工资（元）</label><input id="rate" type="number" min="0" step="10" placeholder="日工资"></div></div>
<div class="row"><div><label>加班小时（可不填）</label><input id="overtimeHours" type="number" min="0" step="0.5" placeholder="例如：2"></div><div><label>加班费（元）</label><input id="overtimePay" type="number" min="0" step="10" placeholder="加班费"></div></div>
<label>工作内容（可不填）</label><input id="workNote" placeholder="例如：配管、预埋、砌墙">
<div class="muted" id="calc" style="margin-top:10px">本次金额：¥0</div><button class="full" id="saveWork">保存这笔记工</button></div>
<div class="panel"><h3 style="margin:0 0 8px">今日记工</h3><div id="todayList"></div></div>
</section>
<section id="workers" class="hidden"><div class="panel"><h3 style="margin-top:0">工人名单</h3><label>姓名</label><input id="workerName" placeholder="输入工人姓名"><div class="row"><div><label>工种</label><input id="workerTrade" placeholder="例如：电工、泥工"></div><div><label>默认日工资（元）</label><input id="workerRate" type="number" min="0" placeholder="例如：300"></div></div><button class="full" id="saveWorker">添加工人</button></div><div class="panel"><h3 style="margin-top:0">已录入工人</h3><div id="workerList"></div></div></section>
<section id="records" class="hidden"><div class="panel"><h3 style="margin-top:0">记工记录</h3><div class="row"><div><label>开始日期</label><input type="date" id="fromDate"></div><div><label>结束日期</label><input type="date" id="toDate"></div></div><button class="full secondary" id="filterRecords">筛选记录</button><div id="recordList" style="margin-top:8px"></div></div></section>
<section id="settle" class="hidden"><div class="panel"><h3 style="margin-top:0">工资汇总</h3><p class="muted">按当前项目统计。借支/已付款可在下方单独登记，结算金额=应计工资+加班费−借支−已付款−生活费−其他扣款。</p><div id="settlementList"></div></div><div class="panel"><h3 style="margin-top:0">登记借支 / 已付款</h3><label>工人</label><select id="payWorker"></select><div class="row"><div><label>类型</label><select id="payType"><option value="advance">借支</option><option value="paid">已付款</option><option value="living">生活费</option><option value="deduction">其他扣款</option></select></div><div><label>金额（元）</label><input id="payAmount" type="number" min="0" step="10" placeholder="金额"></div></div><label>日期</label><input id="payDate" type="date"><label>备注</label><input id="payNote" placeholder="可不填"><button class="full" id="savePay">保存款项</button></div></section>
<section id="settings" class="hidden"><div class="panel"><h3 style="margin-top:0">数据备份</h3><p class="muted">导出备份文件建议定期保存到手机文件或云盘。此工具的数据保存在当前浏览器中，清除浏览器数据可能导致记录丢失。</p><button class="full" id="exportJson">导出完整备份（JSON）</button><button class="full secondary" id="exportCsv">导出当前项目记工表（CSV）</button><label>恢复完整备份</label><input type="file" id="importFile" accept=".json,application/json"><button class="full danger" id="clearData">清空本机全部数据</button></div><div class="panel"><h3 style="margin-top:0">项目管理</h3><div id="projectList"></div></div></section>
</main>
<nav class="nav"><button class="active" data-tab="home">🏠 首页</button><button data-tab="workers">👷 工人</button><button data-tab="records">📒 记录</button><button data-tab="settle">💰 结算</button><button data-tab="settings">⚙️ 设置</button></nav>
<script>
const KEY='site_work_helper_v1';
let db={projects:[],activeProject:'',workers:[],works:[],payments:[]};
const $=id=>document.getElementById(id);
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.projects)db=x}catch(e){}if(!db.projects.length){const id=crypto.randomUUID();db.projects.push({id,name:'我的第一个项目'});db.activeProject=id}if(!db.activeProject||!db.projects.some(p=>p.id===db.activeProject))db.activeProject=db.projects[0].id;save();$('workDate').value=today();$('payDate').value=today();render()}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function project(){return db.projects.find(p=>p.id===db.activeProject)}
function money(n){return '¥'+(Number(n)||0).toLocaleString('zh-CN',{maximumFractionDigits:2})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function workersInProject(){return db.workers}
function getWorker(id){return db.workers.find(w=>w.id===id)}
function currentWorks(){return db.works.filter(w=>w.projectId===db.activeProject)}
function currentPayments(){return db.payments.filter(p=>p.projectId===db.activeProject)}
function workAmount(w){return (w.wageType==='monthly'?(Number(w.rate)||0):(Number(w.days)||0)*(Number(w.rate)||0))+(Number(w.overtimePay)||0)}
function render(){const p=project();$('projectSubtitle').textContent='当前项目：'+p.name+' · 个人本机记账';$('activeProject').innerHTML=db.projects.map(x=>`<option value="${x.id}" ${x.id===db.activeProject?'selected':''}>${esc(x.name)}</option>`).join('');const ws=currentWorks();$('totalCost').textContent=money(ws.reduce((s,w)=>s+workAmount(w),0));$('totalEntries').textContent=ws.length;
const workerOptions='<option value="">请选择工人</option>'+db.workers.map(w=>`<option value="${w.id}">${esc(w.name)}${w.trade?' · '+esc(w.trade):''}</option>`).join('');$('workerSelect').innerHTML=workerOptions;$('payWorker').innerHTML=workerOptions;
if(!$('workerSelect').value&&db.workers.length){$('workerSelect').value=db.workers[0].id;$('rate').value=getWorker(db.workers[0].id)?.rate||''}
$('workerList').innerHTML=db.workers.length?db.workers.map(w=>`<div class="item"><div class="itemtop"><div><b>${esc(w.name)}</b> <span class="tag">${esc(w.trade||'未填工种')}</span><div class="muted">默认${w.wageType==='monthly'?'月工资':'日工资'}：${money(w.rate)}</div></div><button class="danger smallbtn" onclick="deleteWorker('${w.id}')">删除</button></div></div>`).join(''):'<div class="empty">还没有工人，先添加工人名单。</div>';
const todayWorks=ws.filter(w=>w.date===today());$('todayList').innerHTML=todayWorks.length?todayWorks.map(workItem).join(''):'<div class="empty">今天还没有记工记录</div>';
$('recordList').innerHTML=ws.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(workItem).join('')||'<div class="empty">暂无记录</div>';
const sums={};db.workers.forEach(w=>sums[w.id]={name:w.name,days:0,wage:0,advance:0,paid:0,living:0,deduction:0});ws.forEach(w=>{sums[w.workerId]??={name:w.workerName,days:0,wage:0,advance:0,paid:0,living:0,deduction:0};sums[w.workerId].days+=w.days;sums[w.workerId].wage+=workAmount(w)});currentPayments().forEach(p=>{sums[p.workerId]??={name:p.workerName,days:0,wage:0,advance:0,paid:0,living:0,deduction:0};if(p.type==='advance'||p.type==='paid'||p.type==='living'||p.type==='deduction')sums[p.workerId][p.type]=(sums[p.workerId][p.type]||0)+p.amount});
const entries=Object.entries(sums).filter(([id,s])=>s.wage||s.advance||s.paid||s.living||s.deduction);$('settlementList').innerHTML=entries.length?entries.map(([id,s])=>`<div class="item"><div class="itemtop"><div><b>${esc(s.name)}</b><div class="muted">${s.days.toFixed(2).replace(/\.00$/,'')} 工 · 含加班费应计 ${money(s.wage)}</div><div class="muted">借支 ${money(s.advance)} · 已付款 ${money(s.paid)}<br>生活费 ${money(s.living||0)} · 其他扣款 ${money(s.deduction||0)}</div></div><div class="money">${money(s.wage-s.advance-s.paid-(s.living||0)-(s.deduction||0))}</div></div><div class="muted">剩余应付</div></div>`).join(''):'<div class="empty">当前项目还没有工资记录</div>';
$('projectList').innerHTML=db.projects.map(x=>`<div class="item"><div class="itemtop"><div><b>${esc(x.name)}</b><div class="muted">${db.works.filter(w=>w.projectId===x.id).length} 笔记工记录</div></div><div>${x.id===db.activeProject?'<span class="tag">当前项目</span>':`<button class="secondary smallbtn" onclick="switchProject('${x.id}')">切换</button>`}</div></div></div>`).join('');
updateCalc()}
function workItem(w){return `<div class="item"><div class="itemtop"><div><b>${esc(w.workerName)}</b> <span class="tag">${w.days}工</span><div class="muted">${esc(w.date)} · ${esc(w.note||'未填写工作内容')} · ${w.wageType==='monthly'?'月工资':'日工资'} ${money(w.rate)}${w.overtimeHours?` · 加班 ${w.overtimeHours}小时`:''}${w.overtimePay?` · 加班费 ${money(w.overtimePay)}`:''}</div></div><div style="text-align:right"><b>${money(workAmount(w))}</b><div><button class="danger smallbtn" onclick="deleteWork('${w.id}')">删除</button></div></div></div></div>`}
function updateCalc(){const days=Number($('days').value)||0,rate=Number($('rate').value)||0,ot=Number($('overtimePay').value)||0;const monthly=$('wageType').value==='monthly';$('rateLabel').textContent=monthly?'月工资（元）':'日工资（元）';$('calc').textContent='本次金额：'+money((monthly?rate:days*rate)+ot)}
$('wageType').addEventListener('change',updateCalc)
$('activeProject').addEventListener('change',e=>{db.activeProject=e.target.value;save();render()});
$('workerSelect').addEventListener('change',e=>{$('rate').value=getWorker(e.target.value)?.rate||'';updateCalc()});$('days').addEventListener('change',updateCalc);$('rate').addEventListener('input',updateCalc);$('overtimePay').addEventListener('input',updateCalc);
$('addProjectBtn').onclick=()=>{const name=prompt('请输入新项目名称');if(!name||!name.trim())return;const p={id:crypto.randomUUID(),name:name.trim()};db.projects.push(p);db.activeProject=p.id;save();render();alert('新项目已添加。工人名单可以继续共用。')};
$('saveWork').onclick=()=>{const worker=getWorker($('workerSelect').value);if(!worker){alert('请先添加或选择工人。');return}const wageType=$('wageType').value,days=Number($('days').value),rate=Number($('rate').value),overtimeHours=Number($('overtimeHours').value)||0,overtimePay=Number($('overtimePay').value)||0;if(!Number.isFinite(rate)||rate<0||overtimePay<0){alert('请填写正确的工资金额');return}db.works.push({id:crypto.randomUUID(),projectId:db.activeProject,date:$('workDate').value||today(),workerId:worker.id,workerName:worker.name,days,wageType,rate,overtimeHours,overtimePay,note:$('workNote').value.trim()});save();$('workNote').value='';$('overtimeHours').value='';$('overtimePay').value='';render();$('workerSelect').value=worker.id;$('rate').value=rate;updateCalc();}
$('saveWorker').onclick=()=>{const name=$('workerName').value.trim();if(!name){alert('请输入工人姓名');return}if(db.workers.some(w=>w.name.trim()===name)){alert('这个工人已经录入，不要重复添加。');return}db.workers.push({id:crypto.randomUUID(),name,trade:$('workerTrade').value.trim(),rate:Number($('workerRate').value)||0});$('workerName').value='';$('workerTrade').value='';$('workerRate').value='';save();render()};
window.deleteWorker=id=>{if(!confirm('删除这个工人档案？历史记工不会删除。'))return;db.workers=db.workers.filter(w=>w.id!==id);save();render()};
window.deleteWork=id=>{if(!confirm('确定删除这笔记工？'))return;db.works=db.works.filter(w=>w.id!==id);save();render()};
window.switchProject=id=>{db.activeProject=id;save();render()};
$('savePay').onclick=()=>{const w=getWorker($('payWorker').value),amount=Number($('payAmount').value);if(!w){alert('请选择工人');return}if(!(amount>0)){alert('请输入大于0的金额');return}db.payments.push({id:crypto.randomUUID(),projectId:db.activeProject,workerId:w.id,workerName:w.name,type:$('payType').value,amount,date:$('payDate').value||today(),note:$('payNote').value.trim()});$('payAmount').value='';$('payNote').value='';save();render();alert('款项已保存')};
$('filterRecords').onclick=()=>{const from=$('fromDate').value,to=$('toDate').value;const ws=currentWorks().filter(w=>(!from||w.date>=from)&&(!to||w.date<=to)).sort((a,b)=>b.date.localeCompare(a.date));$('recordList').innerHTML=ws.map(workItem).join('')||'<div class="empty">这个日期范围内没有记录</div>'};
function download(name,content,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('exportJson').onclick=()=>download('工地记工备份_'+today()+'.json',JSON.stringify(db,null,2),'application/json;charset=utf-8');
$('exportCsv').onclick=()=>{const rows=[['项目','日期','工人','工种','工资方式','工数','工资金额','加班小时','加班费','合计金额','工作内容']];currentWorks().forEach(w=>{const p=db.projects.find(p=>p.id===w.projectId),worker=getWorker(w.workerId);rows.push([p?.name||'',w.date,w.workerName,worker?.trade||'',w.wageType==='monthly'?'月工资':'日工资',w.days,w.rate,w.overtimeHours||0,w.overtimePay||0,workAmount(w).toFixed(2),w.note||''])});const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');download('当前项目记工_'+today()+'.csv',csv,'text/csv;charset=utf-8')};
$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!x.projects||!x.workers||!x.works)throw Error();if(confirm('恢复备份会覆盖当前本机数据，是否继续？')){db=x;save();render();alert('备份恢复成功')}}catch(err){alert('文件无法识别，请选择之前导出的完整 JSON 备份')}e.target.value=''};
$('clearData').onclick=()=>{if(confirm('确定清空全部项目、工人、记工和付款数据？建议先导出备份。')&&confirm('再次确认：此操作无法撤销。')){localStorage.removeItem(KEY);db={projects:[],activeProject:'',workers:[],works:[],payments:[]};load()}};
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));['home','workers','records','settle','settings'].forEach(id=>$(id).classList.toggle('hidden',id!==b.dataset.tab));if(b.dataset.tab==='records'){$('fromDate').value='';$('toDate').value='';$('filterRecords').click()}});
load();
</script></body></html>
